[project]
name = "grassmann-speech"
version = "0.1.0"
description = "Causal Grassmann layer (arXiv 2512.19428) vs attention: language-model parity and speech recognition"
requires-python = ">=3.15"
dependencies = [
    "pyarrow==26.0.1",
    "tokenizers==0.23.3",
    "torch==2.15.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 140

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore:Failed to initialize NumPy"]
